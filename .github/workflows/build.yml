
name: VELOCITY Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract VELOCITY
        run: |
          unzip -o VELOCITY.zip -d velocity-source
          PROJECT_DIR=$(dirname "$(find velocity-source -name CMakeLists.txt -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build VELOCITY for Android
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.0.0
          target: Android64
          path: ${{ env.PROJECT_DIR }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VELOCITY-Android
          path: ${{ env.PROJECT_DIR }}/build/**/*.geode
          
